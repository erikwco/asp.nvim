name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      # Windows no está en la matriz: el build usa make/cc/.so (Unix).
      # Soporte Windows requeriría un path de build separado (backlog).
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        nvim: [ stable, nightly ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      # `make test` compila el parser.c versionado (sólo requiere cc) — este
      # job replica lo que hace un usuario al instalar. Node/tree-sitter CLI
      # sólo se instalan para el paso de corpus, no para compilar.
      - name: Compilar (desde parser.c versionado) y correr la suite
        run: make test

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Corpus de las gramáticas
        # `tree-sitter test` necesita src/grammar.json (ignorado en el repo),
        # así que se regenera de forma transitoria antes de correr el corpus.
        run: |
          (cd grammars/aspclassic && npx -y tree-sitter-cli@0.25.10 generate && npx -y tree-sitter-cli@0.25.10 test)
          (cd grammars/vbscript && npx -y tree-sitter-cli@0.25.10 generate && npx -y tree-sitter-cli@0.25.10 test)

      - name: Generar helptags
        run: make helptags

  # Falla si el parser.c versionado quedó desactualizado respecto a su
  # grammar.js (alguien editó la gramática y olvidó `make generate`).
  parser-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerar y verificar que no hay cambios
        run: |
          make generate
          git diff --exit-code -- \
            grammars/aspclassic/src/parser.c \
            grammars/aspclassic/src/node-types.json \
            grammars/vbscript/src/parser.c \
            grammars/vbscript/src/node-types.json \
          || (echo "::error::parser.c versionado desactualizado — corré 'make generate' y commiteá" && exit 1)
